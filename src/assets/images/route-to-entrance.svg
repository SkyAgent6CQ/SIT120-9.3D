<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Plan of the walk from Res Reception up the ramp to the lower level of the MA Car Park" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Walking route from Res Reception to the lower level</title>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#B8451F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="400" fill="#F1F5EE"/>

  <!-- LC building, used as the thing you face -->
  <rect x="34" y="46" width="150" height="168" fill="#FFFFFF" stroke="#D8E2D3" stroke-width="3"/>
  <text x="109" y="126" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#1C2B26">LC Building</text>
  <text x="109" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5A6B63">face this way</text>

  <!-- Starting point -->
  <rect x="34" y="286" width="196" height="76" fill="#015E4B"/>
  <text x="132" y="318" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">Res Reception</text>
  <text x="132" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#B4D79A">start here</text>

  <!-- The route itself -->
  <path d="M230 324 L296 324 L296 168 L392 168" fill="none" stroke="#B8451F" stroke-width="6" stroke-linecap="square" stroke-dasharray="14 10" marker-end="url(#arrow)"/>

  <!-- Ramp: rungs across the climbing part of the route -->
  <g stroke="#B8451F" stroke-width="3">
    <line x1="276" y1="292" x2="316" y2="292"/>
    <line x1="276" y1="264" x2="316" y2="264"/>
    <line x1="276" y1="236" x2="316" y2="236"/>
    <line x1="276" y1="208" x2="316" y2="208"/>
  </g>
  <text x="330" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#B8451F">Ramp up</text>
  <text x="330" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1C2B26">not the stairs down</text>

  <!-- Destination: lower level -->
  <rect x="408" y="106" width="198" height="158" fill="#FFFFFF" stroke="#015E4B" stroke-width="4"/>
  <text x="507" y="136" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#015E4B">Lower level</text>
  <text x="507" y="157" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1C2B26">MA Car Park</text>
  <g fill="#1C2B26">
    <rect x="428" y="180" width="30" height="24"/>
    <rect x="466" y="180" width="30" height="24"/>
    <rect x="504" y="180" width="30" height="24"/>
    <rect x="542" y="180" width="30" height="24"/>
  </g>
  <rect x="428" y="214" width="144" height="10" fill="#6CA145"/>
  <text x="507" y="252" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#1C2B26">crates, then the table</text>

  <!-- Where the map pin sends you instead -->
  <rect x="408" y="26" width="198" height="56" fill="none" stroke="#9aa8a1" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="507" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5A6B63">Roof level</text>
  <text x="507" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5A6B63">where a map pin lands</text>

  <text x="34" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#5A6B63">About a three minute walk.</text>
</svg>
