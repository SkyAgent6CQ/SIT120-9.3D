<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="A tote bag holding bread, a tin and fresh greens" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A tote bag packed with items from a session</title>

  <rect x="0" y="0" width="480" height="400" fill="#F1F5EE"/>

  <!-- Contents, drawn first so the bag sits in front of them -->
  <g stroke="#015E4B" stroke-width="5" stroke-linejoin="round">
    <!-- greens -->
    <path d="M150 196 C130 150 148 116 176 104 C182 142 176 176 150 196 z" fill="#6CA145"/>
    <path d="M158 198 C138 168 138 140 156 124 C170 156 172 180 158 198 z" fill="#6CA145"/>
    <!-- tin -->
    <path d="M196 128 h64 v70 h-64 z" fill="#B8451F"/>
    <ellipse cx="228" cy="128" rx="32" ry="12" fill="#CF5B2E"/>
    <!-- bread -->
    <rect x="286" y="92" width="46" height="128" rx="23" fill="#D9A566" transform="rotate(18 309 156)"/>
  </g>

  <!-- The bag -->
  <path d="M120 190 L360 190 L338 358 L142 358 z" fill="#FFFFFF" stroke="#015E4B" stroke-width="7" stroke-linejoin="round"/>
  <rect x="120" y="190" width="240" height="22" fill="#015E4B"/>
  <path d="M172 190 C172 104 308 104 308 190" fill="none" stroke="#015E4B" stroke-width="10" stroke-linecap="round"/>

  <!-- Green stripe on the bag, matching the volunteers' aprons -->
  <rect x="152" y="256" width="176" height="18" fill="#6CA145"/>
</svg>
