<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" role="img" aria-label="Timeline of a session: collection run at 12:30pm, set-up at 2:30pm, doors open at 4:00pm, pack down at 5:15pm" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How a session runs, from the collection run to pack down</title>

  <rect x="0" y="0" width="480" height="380" fill="#F1F5EE"/>

  <!-- Spine -->
  <line x1="58" y1="52" x2="58" y2="322" stroke="#D8E2D3" stroke-width="8" stroke-linecap="round"/>

  <!-- 12:30pm -->
  <circle cx="58" cy="52" r="15" fill="#6CA145"/>
  <text x="100" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#015E4B">12:30pm</text>
  <text x="100" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1C2B26">Collection run leaves</text>

  <!-- 2:30pm -->
  <circle cx="58" cy="142" r="15" fill="#6CA145"/>
  <text x="100" y="136" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#015E4B">2:30pm</text>
  <text x="100" y="164" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1C2B26">Crates out, table up</text>

  <!-- 4:00pm -->
  <circle cx="58" cy="232" r="15" fill="#B8451F"/>
  <text x="100" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#B8451F">4:00pm</text>
  <text x="100" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1C2B26">Queue moves, limit called</text>

  <!-- 5:15pm -->
  <circle cx="58" cy="322" r="15" fill="#6CA145"/>
  <text x="100" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#015E4B">5:15pm</text>
  <text x="100" y="344" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#1C2B26">Pack down, back by six</text>
</svg>
